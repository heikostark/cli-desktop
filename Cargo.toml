[package]
name = "rust-desktop"
version = "0.1.0"
edition = "2021"
description = "A text-based desktop (ASCII wallpaper, icons, taskbar, trash) using tmux as the window manager"

[dependencies]
crossterm = { version = "0.27", features = ["event-stream"] }
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
unicode-width = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
signal-hook = "0.3"

[profile.release]
opt-level = 3
lto = true
